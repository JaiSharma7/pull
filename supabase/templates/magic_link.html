<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px 24px;
      background: #f4f1ea;
      color: #14120e;
      font-family: Georgia, 'Times New Roman', serif;
    "
  >
    <div style="max-width: 34rem; margin: 0 auto">
      <p
        style="
          font-family: ui-monospace, 'SF Mono', Menlo, monospace;
          font-size: 12px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #6b6459;
          margin: 0 0 24px;
        "
      >
        What a Pull
      </p>

      <h1 style="font-size: 28px; line-height: 1.15; margin: 0 0 16px; font-weight: 600">
        Your sign-in code
      </h1>

      <!--
        The code comes first, deliberately. A link opened on a phone often lands in a
        different browser than the one that started the sign-in, and the session then
        arrives somewhere the reader is not looking. A typed code always completes in
        the tab they already have open.
      -->
      <p
        style="
          font-family: ui-monospace, 'SF Mono', Menlo, monospace;
          font-size: 32px;
          letter-spacing: 0.18em;
          margin: 0 0 8px;
          color: #8c2f26;
        "
      >
        {{ .Token }}
      </p>
      <p
        style="
          font-family: system-ui, sans-serif;
          font-size: 15px;
          color: #6b6459;
          margin: 0 0 32px;
        "
      >
        Enter this in the tab you started from. It expires shortly and works once.
      </p>

      <hr style="border: 0; border-top: 1px solid rgba(20, 18, 14, 0.12); margin: 0 0 24px" />

      <p style="font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6; margin: 0">
        Or
        <a href="{{ .ConfirmationURL }}" style="color: #8c2f26">open this link</a>
        instead — same result.
      </p>

      <p
        style="
          font-family: system-ui, sans-serif;
          font-size: 13px;
          color: #6b6459;
          line-height: 1.6;
          margin: 32px 0 0;
        "
      >
        If you did not ask to sign in, ignore this — nothing happens until the code or link is used.
      </p>
    </div>
  </body>
</html>
