name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

# No job here references `secrets.*`, and none should. `pull_request` runs with a
# read-only token and, on a fork, no access to repository secrets at all — so a
# workflow that needed one would either fail for every outside contributor or have
# to be `pull_request_target`, which runs the *base* workflow against untrusted head
# code with secrets in scope. That is the shape most supply-chain incidents take.
#
# Everything below runs on public inputs: pnpm installs from the lockfile, and
# `supabase start` boots a local stack whose keys are the published defaults. If a
# check ever genuinely needs a credential, it belongs in a separate workflow gated
# on `push` to a branch, not in this one.

jobs:
  # Check 1 of 6 — style drift, dead code, and JSX accessibility rules.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      # `eslint.config.js` ignores supabase/functions ("Deno runtime, separate lint
      # pass") and the package's own lint script was `echo "linted by Deno, not
      # eslint"`. Nothing ever ran Deno. That left the worker — which holds the
      # service-role key, performs the outbound fetch, and is the SSRF surface — as
      # the one part of the tree with no lint at all, while this job's own comment
      # claimed to cover dead code. The separate pass now exists.
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Lint Edge Functions (Deno)
        run: deno lint
        working-directory: supabase/functions

  # Check 2 of 6 — schema/code drift is the likeliest breakage in this repo,
  # so typecheck runs against the committed generated Supabase types.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Check 3 of 6 — the signature mechanics must not change behaviour silently.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Check 4 of 6 — replay every migration from zero on a real Supabase stack,
  # then assert the invariants that a missing policy would violate. An RLS gap
  # is a data breach, and it is trivial to introduce by adding a table.
  db:
    name: db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (db + auth only)
        run: pnpm exec supabase start -x studio,realtime,storage-api,imgproxy,inbucket,logflare,vector,edge-runtime,supavisor

      - name: Replay all migrations from zero
        run: pnpm exec supabase db reset --no-seed

      - name: Assert RLS, policies, and FK indexes
        run: pnpm run db:lint

      # Behaviour, not shape. These run as a real reader through RLS against the
      # seeded corpus. The smoke script existed from round 1 but nothing ever ran
      # it, which is how a read-path regression would have reached main without
      # anyone noticing.
      #
      # There used to be a second `supabase db reset` here, labelled "seed corpus
      # applies cleanly". It proved nothing: there is no supabase/seed.sql and no
      # [db.seed] in config.toml, so `--no-seed` and the default do exactly the same
      # work. The seed lives in migrations, which the replay above already covers.
      - name: Read path behaves under RLS
        run: pnpm run db:test

      # Regenerate in place and let git decide. Diffing against a temp file made
      # this compare the CLI's raw output with a committed file that carries a
      # header, which could never match.
      - name: Generated types are in sync with the schema
        run: |
          pnpm db:types
          git diff --exit-code -- packages/db/src/database.types.ts \
            || { echo "::error::Generated DB types are stale. Run 'pnpm db:types' and commit the result."; exit 1; }

  # Check 5 of 6 — a committed credential, in the tree or anywhere in history.
  #
  # This repository commits two keys on purpose (law 7: a VITE_* variable is in the
  # bundle every visitor downloads, so the publishable key is public by construction).
  # That is precisely the condition under which a real secret goes unnoticed — a
  # reviewer who has learned that .env.production is fine stops reading it. The two
  # intentional values are allowlisted by exact string in .gitleaks.toml; everything
  # else that looks like a credential fails here.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history: a key removed in a later commit is still in every clone.
        with: { fetch-depth: 0 }
      # The binary, pinned, rather than gitleaks/gitleaks-action@v2.
      #
      # The action was tried first and fails on every pull request: "GITHUB_TOKEN is
      # now required to scan pull requests". Supplying it would work, and would also
      # be the first `secrets.*` reference in this file — which the comment at the top
      # says there should not be. `secrets.GITHUB_TOKEN` is the auto-provided token
      # rather than a configured one, so it is not the supply-chain hazard that comment
      # is really about, but "no secrets here at all" is a property worth keeping
      # literally true rather than one with an exception a reader has to evaluate.
      #
      # It also removes two surprises: the action does a licence check (free for
      # individual accounts, required for organisations, so this would break the day
      # the repo moves to an org) and it installs whatever gitleaks version it likes —
      # 8.24.3 today, against the 8.28.0 the config was written and verified on.
      - name: Scan for committed credentials
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          # Arch-detected rather than hardcoded x64. `ubuntu-latest` is x64 today and
          # GitHub is rolling out arm64 runners; on the wrong one the download succeeds
          # and the binary dies with "Exec format error", which reads like a corrupt
          # release rather than the one-word problem it is. (Found by running this
          # locally on an aarch64 machine.)
          case "$(uname -m)" in
            x86_64)  GL_ARCH=x64 ;;
            aarch64) GL_ARCH=arm64 ;;
            *) echo "::error::unsupported arch $(uname -m) for gitleaks"; exit 1 ;;
          esac
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `git` scans every commit reachable here, not just the diff: a key removed in
          # a later commit is still in every clone that fetched the earlier one.
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner .

  # Check 6 of 6 — every commit carries a Developer Certificate of Origin sign-off.
  #
  # `Signed-off-by:` is the contributor asserting they have the right to submit the
  # code under the project's licence. It is a provenance record, per commit, and it is
  # the only thing this project asks: there is no CLA, so inbound is outbound and this
  # check is the whole of the contribution paperwork.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Who opened the pull request, per GitHub — not a git author field, which the
          # committer chooses freely. The bot exemption below is gated on this so that
          # setting `user.email` to something ending `[bot]@users.noreply.github.com`
          # cannot skip the check on a human's pull request.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # The commit that introduced this check. Anything that is an ancestor of it
          # predates the policy and is exempt.
          #
          # Without this, the first pull request fails on 128 commits written before the
          # DCO existed — which is nobody's fault and not fixable without rewriting
          # published history. Law 6's instinct about not editing what others have
          # already applied is the same instinct here.
          DCO_SINCE: 73c17b9
        run: |
          set -euo pipefail
          missing=0
          checked=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if git merge-base --is-ancestor "$sha" "$DCO_SINCE" 2>/dev/null; then
              continue
            fi
            # A bot cannot certify origin. The DCO is a *person* stating they wrote
            # the change or have the right to submit it; a bot has no legal
            # personality, so there is nothing for it to assert and nobody to hold
            # to it. Dependabot edits a version constant in a manifest, and the
            # certification that actually matters happens when a human reviews and
            # merges the result.
            #
            # Without this, every dependency update is red forever — which does not
            # add rigour, it teaches reviewers to scroll past a failing DCO. A check
            # that is always red for a whole class of pull requests is worse than
            # the gap it closes.
            #
            # Two conditions, not one. `PR_AUTHOR` comes from GitHub and cannot be set
            # by the committer; the author email can. The email must also be *this*
            # bot's noreply address, derived from the login, so a commit on a
            # Dependabot branch has to claim to be Dependabot rather than merely to be
            # some bot.
            #
            # Be honest about the limit: a human who pushes to a bot's branch and sets
            # `user.email` to `…+dependabot[bot]@users.noreply.github.com` is still
            # skipped. Nothing checkable from a git author field closes that, because
            # the field is chosen by whoever writes the commit. The DCO is a provenance
            # record, not an access control — someone willing to impersonate a bot to
            # dodge it could as easily paste a `Signed-off-by` line they are not
            # entitled to, which no check catches either. What this narrowing buys is
            # that the mistake has to be deliberate rather than incidental.
            case "$PR_AUTHOR" in
              *'[bot]')
                case "$(git show -s --format='%ae' "$sha")" in
                  *"+$PR_AUTHOR@users.noreply.github.com"|"$PR_AUTHOR@users.noreply.github.com")
                    echo "skipped, bot commit: $(git show -s --format='%h %s' "$sha")"
                    continue
                    ;;
                esac
                ;;
            esac
            checked=$((checked + 1))
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format=%B "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE".."$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo "Add sign-off with: git commit -s   (or: git rebase --signoff $BASE)"
            echo "See CONTRIBUTING.md — Developer Certificate of Origin."
            exit 1
          fi
          echo "Signed off: $checked commit(s) checked."
